name: Deploy

on:
  workflow_run:
    workflows:
      - Publish Docker Images
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::227246780882:role/docker-task-manager-github-deploy
          aws-region: ap-south-1

      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:Deployment,Values=docker-task-manager" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo -u ec2-user -H env IMAGE_TAG=${{ github.event.workflow_run.head_sha }} docker compose --env-file /home/ec2-user/docker-task-manager/.env -f /home/ec2-user/docker-task-manager/compose.production.yml pull",
              "sudo -u ec2-user -H env IMAGE_TAG=${{ github.event.workflow_run.head_sha }} docker compose --env-file /home/ec2-user/docker-task-manager/.env -f /home/ec2-user/docker-task-manager/compose.production.yml up -d"
            ]' \
            --comment "Deploy ${{ github.event.workflow_run.head_sha }}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment succeeded."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with status: $STATUS"
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment timed out waiting for SSM."
          exit 1