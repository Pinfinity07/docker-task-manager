name: Deploy

on:
  workflow_run:
    workflows:
      - Publish Docker Images
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Show commit being deployed
        run: echo "Deploying ${{ github.event.workflow_run.head_sha }}"